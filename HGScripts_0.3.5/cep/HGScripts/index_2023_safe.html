<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>HGScripts 2023 safe</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #161b1f;
      color: #f2f4f5;
      font-family: "Microsoft YaHei", Arial, sans-serif;
      font-size: 13px;
    }
    body {
      display: flex;
      flex-direction: column;
    }
    .bar {
      flex: 0 0 auto;
      padding: 8px;
      background: #303437;
      border-bottom: 1px solid #454b50;
    }
    .title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .row {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    input {
      flex: 1 1 auto;
      min-width: 0;
      height: 26px;
      box-sizing: border-box;
      padding: 4px 7px;
      border: 1px solid #555c62;
      background: #20262b;
      color: #f2f4f5;
      outline: none;
    }
    button {
      flex: 0 0 auto;
      height: 26px;
      padding: 0 10px;
      border: 1px solid #626a70;
      background: #3a4045;
      color: #fff;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
    }
    button:hover {
      background: #475058;
    }
    button.primary {
      background: #0f6fbd;
      border-color: #1681d8;
    }
    .status {
      flex: 0 0 auto;
      padding: 6px 8px;
      color: #d5d9dc;
      border-bottom: 1px solid #30363b;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .list {
      flex: 1 1 auto;
      overflow: auto;
      min-height: 80px;
      background: #11181e;
    }
    .item {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      border: 0;
      border-bottom: 1px solid #242b31;
      background: transparent;
      color: #f4f4f4;
      text-align: left;
      height: auto;
      cursor: pointer;
    }
    .item:hover, .item.selected {
      background: #26323b;
    }
    .name {
      display: block;
      font-size: 13px;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .path {
      display: block;
      margin-top: 3px;
      color: #9ea8af;
      font-size: 11px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .footer {
      flex: 0 0 auto;
      padding: 8px;
      background: #20262b;
      border-top: 1px solid #30363b;
    }
    .output {
      margin-top: 7px;
      max-height: 92px;
      overflow: auto;
      padding: 6px;
      box-sizing: border-box;
      background: #0b1116;
      border: 1px solid #30363b;
      color: #dce4e8;
      font-family: Consolas, monospace;
      font-size: 11px;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="bar">
    <div class="title">HGScripts v0.3.5</div>
    <div class="row">
      <input id="search" type="text" placeholder="搜索脚本">
      <button id="refreshBtn">刷新</button>
    </div>
  </div>
  <div id="status" class="status">正在启动兼容面板...</div>
  <div id="list" class="list"></div>
  <div class="footer">
    <div class="row">
      <button id="runBtn" class="primary">运行选中脚本</button>
      <button id="copyBtn">复制结果</button>
    </div>
    <div id="output" class="output">等待操作</div>
  </div>
  <script src="assets/js/CSInterface.js"></script>
  <script src="assets/js/app_2023_safe.js?v=0.3.5-release-20260625"></script>
</body>
</html>
